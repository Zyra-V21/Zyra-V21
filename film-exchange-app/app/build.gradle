plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nexora.exchange'
    compileSdk 34

    defaultConfig {
        applicationId 'com.nexora.exchange'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '2.84.3'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
