name: metrics
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # PAT clasico con scopes repo + read:org, guardado como secret METRICS_TOKEN
      - name: Stats terminal (lenguajes por commit, lineas)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Zyra-V21
          template: terminal
          base: header, metadata
          config_timezone: Europe/Madrid
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_limit: 8
          plugin_lines: yes
          filename: assets/metrics-terminal.svg

      - name: Habitos y logros (commits/dia, horas activas)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Zyra-V21
          template: classic
          base: ""
          config_timezone: Europe/Madrid
          plugin_habits: yes
          plugin_habits_days: 30
          plugin_habits_charts: yes
          plugin_achievements: yes
          plugin_achievements_threshold: C
          filename: assets/metrics-habits.svg
